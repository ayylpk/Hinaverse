# sorasakihina.cn 家族路由（2026-09-07 子域名版，见桌面处置单）
# 根域 = AgentMemory + 301 过渡（未来给博客）；hinaverse 子域 = Hinaverse 全家
# 部署：本机 scp 上服务器 → sudo cp 到 /etc/nginx/sites-available/sorasakihina
#       → 替换两处 ssl_certificate* 为实际证书文件名 → sudo nginx -t && reload

# ── HTTP 一律跳 HTTPS ──
server {
    listen 80 default_server;
    server_name sorasakihina.cn www.sorasakihina.cn hinaverse.sorasakihina.cn;
    return 301 https://$host$request_uri;
}

# ── Hinaverse 全家（主站 + 运营台 + API + WS + APK） ──
server {
    listen 443 ssl;
    http2 on;
    server_name hinaverse.sorasakihina.cn;

    ssl_certificate     /etc/nginx/ssl/HINA_CERT.pem;    # ← 换实际文件名
    ssl_certificate_key /etc/nginx/ssl/HINA_CERT.key;

    root /var/www/hinaverse;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /apk/ {
        alias /var/www/hinaverse/apk/;
        autoindex off;
    }
}

# ── 根域：AgentMemory 原样 + 其余 301 去子域（博客上线后删 catch-all 换静态站） ──
server {
    listen 443 ssl;
    http2 on;
    server_name sorasakihina.cn www.sorasakihina.cn;

    ssl_certificate     /etc/nginx/ssl/CERT.pem;          # ← 现有双 SAN 证或新三 SAN 证
    ssl_certificate_key /etc/nginx/ssl/CERT.key;

    # AgentMemory：后台静态 + API + 健康检查（自 8/29 未动）
    location /agentmemory/ {
        alias /opt/agentmemory/dist/;
        index index.html;
        try_files $uri $uri/ /agentmemory/index.html;
    }
    location /agentmemory/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /agentmemory/health {
        proxy_pass http://127.0.0.1:3000/health;
    }

    # 过渡兜底：老书签 / 老壳 APK（未更新前）跟着 301 走；博客上线后整段换静态站
    location / {
        return 301 https://hinaverse.sorasakihina.cn$request_uri;
    }
}
