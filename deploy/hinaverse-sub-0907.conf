# 子域名 server block（增量挂载版，2026-09-07）
# 只加不改：根域现有配置原样保留（IP 直连临时入口继续活着），
# 本文件放 /etc/nginx/sites-available/hinaverse-sub，软链进 sites-enabled 即可。
# 备案通过、正式切换时改用 deploy/nginx-sorasakihina-20260907.conf 整版替换（含根域 301）。

server {
    listen 443 ssl http2;

    server_name hinaverse.sorasakihina.cn;

    ssl_certificate     /etc/nginx/ssl/hinaverse/hinaverse.sorasakihina.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/hinaverse/hinaverse.sorasakihina.cn.key;

    root /var/www/hinaverse;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /apk/ {
        alias /var/www/hinaverse/apk/;
        autoindex off;
    }
}
